{% extends "base.html" %}
{% block title %}下载列表{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="page-header">
            <h2 class="gradient-text">下载列表</h2>
            <p>图片抓取与种子下载任务统一展示</p>
        </div>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title mb-3">
                    <i class="bi bi-list-check"></i> 任务列表
                    <span id="taskCount" class="badge ms-2" style="background:var(--accent);">0</span>
                    <button class="btn btn-sm btn-outline-secondary float-end py-0 px-2" id="clearFinishedBtn" onclick="clearFinished()">
                        <i class="bi bi-trash3"></i> 清除已完成
                    </button>
                </h5>
                <div id="downloadList"></div>
                <div id="downloadEmpty" class="text-center py-5" style="color:var(--text-muted);">
                    <i class="bi bi-inbox" style="font-size:2rem;"></i>
                    <div>暂无下载任务</div>
                    <div style="font-size:0.85rem;">去 <a href="{{ url_for('main.browse') }}" class="info-link">浏览</a> 页发起抓取吧</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
var pollTimer = null;

var STATUS_MAP = {
    'pending':       {icon: 'bi-hourglass-split',  text: '等待中',   color: 'var(--text-muted)'},
    'running':       {icon: 'bi-arrow-down-circle', text: '下载中',  color: '#0d6efd'},
    'scraping':      {icon: 'bi-search',            text: '采集中',   color: 'var(--warning)'},
    'saving_nfo':    {icon: 'bi-file-earmark-code', text: '保存NFO', color: '#17a2b8'},
    'adding_torrent':{icon: 'bi-magnet',            text: '添加种子', color: '#6f42c1'},
    'matching':      {icon: 'bi-search',            text: '等待匹配', color: '#e83e8c'},
    'downloading':   {icon: 'bi-arrow-down-circle', text: '下载中',   color: '#0d6efd'},
    'importing':     {icon: 'bi-box-arrow-in-down', text: '导入中',   color: '#fd7e14'},
    'done':          {icon: 'bi-check-circle-fill', text: '完成',     color: 'var(--success)'},
    'error':         {icon: 'bi-x-circle-fill',     text: '失败',     color: 'var(--accent)'},
    'failed':        {icon: 'bi-x-circle-fill',     text: '失败',     color: 'var(--accent)'},
};

var QB_STATE_MAP = {
    'downloading': '下载中', 'stalledDL': '等待下载', 'uploading': '做种中',
    'stalledUP': '等待做种', 'queuedDL': '排队下载', 'queuedUP': '排队做种',
    'pausedDL': '已暂停', 'pausedUP': '暂停做种', 'checkingDL': '校验中',
    'checkingUP': '校验做种', 'error': '错误', 'missingFiles': '文件缺失',
    'not_found': '未找到种子', 'forcedDL': '强制下载', 'forcedUP': '强制做种',
    'metaDL': '获取元数据',
};

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    });
}

function formatTime(iso) {
    if (!iso) return '';
    try {
        var d = new Date(iso + (iso.length === 16 ? 'Z' : ''));
        return d.toLocaleTimeString('zh-CN', {hour12: false});
    } catch (e) { return ''; }
}

function updateTasks() {
    fetch('/api/v1/downloads/tasks')
    .then(function(r) { return r.json(); })
    .then(function(resp) {
        var items = (resp.data && resp.data.items) || [];
        renderList(items);
    })
    .catch(function() {});
}

function renderList(items) {
    var listEl = document.getElementById('downloadList');
    var emptyEl = document.getElementById('downloadEmpty');
    document.getElementById('taskCount').textContent = items.length;

    if (!items.length) {
        listEl.innerHTML = '';
        emptyEl.style.display = '';
        return;
    }
    emptyEl.style.display = 'none';

    var html = '';
    for (var i = 0; i < items.length; i++) {
        html += buildTaskHtml(items[i]);
    }
    listEl.innerHTML = html;
}

function buildTaskHtml(t) {
    var st = STATUS_MAP[t.status] || {icon: 'bi-hourglass-split', text: t.status, color: 'var(--text-muted)'};
    var isScrape = t.type === 'scrape';
    var finished = ['done', 'error', 'failed'].indexOf(t.status) >= 0;

    var html = '<div class="card mb-2" style="border-left:3px solid ' + st.color + ';">';
    html += '<div class="card-body py-2 px-3">';
    // 标题独立主行：加大加粗、可换行，一眼可辨
    html += '<div class="mb-1" style="font-size:1rem;font-weight:600;color:var(--text-primary);overflow-wrap:anywhere;line-height:1.4;">' + esc(t.title || t.url || '(未命名任务)') + '</div>';
    html += '<div class="d-flex justify-content-between align-items-center">';
    html += '<div class="d-flex align-items-center gap-2 flex-wrap">';
    html += '<span style="color:' + st.color + ';font-size:0.85rem;"><i class="bi ' + st.icon + '"></i> ' + st.text + '</span>';
    html += '<span class="badge" style="background:var(--bg-tertiary);color:var(--text-secondary);font-size:0.72rem;">';
    html += '<i class="bi ' + (isScrape ? 'bi-images' : 'bi-magnet') + '"></i> ';
    html += isScrape ? '图片抓取' : '种子下载';
    html += '</span>';
    html += '</div>';
    html += '<div class="d-flex align-items-center gap-2">';
    html += '<small style="color:var(--text-muted);">' + formatTime(t.created_at) + '</small>';
    if (finished) {
        html += '<button class="btn btn-sm btn-outline-secondary py-0 px-1" data-task-type="' + t.type + '" data-task-id="' + esc(t.id) + '" title="删除">';
        html += '<i class="bi bi-trash3" style="font-size:0.75rem;"></i></button>';
    } else if (isScrape && ['pending', 'running'].indexOf(t.status) >= 0) {
        // 取消进行中的抓取任务：卡死任务可立即解锁队列，无需重启服务
        html += '<button class="btn btn-sm btn-outline-danger py-0 px-1" data-task-type="' + t.type + '" data-task-id="' + esc(t.id) + '" title="取消任务" data-confirm="确定取消此任务？已下载的页会保留，重新发起可续传。">';
        html += '<i class="bi bi-x-circle" style="font-size:0.75rem;"></i></button>';
    }
    html += '</div>';
    html += '</div>';

    if (t.message) {
        html += '<div style="color:var(--text-secondary);font-size:0.85rem;margin-top:4px;">' + esc(t.message) + '</div>';
    }

    // 进度条（进行中且总数/百分比有效时显示）
    if (!finished && (t.progress_pct > 0 || (t.total && t.total > 0))) {
        var label = isScrape
            ? (t.progress || 0) + ' / ' + (t.total || 0) + ' 页'
            : (QB_STATE_MAP[t.qb_state] || t.qb_state || '');
        html += '<div style="margin-top:8px;">';
        html += '<div class="d-flex justify-content-between align-items-center mb-1">';
        html += '<span style="color:var(--text-secondary);font-size:0.8rem;">' + esc(label) + '</span>';
        html += '<span style="color:var(--text-primary);font-size:0.85rem;font-weight:bold;">' + t.progress_pct.toFixed(1) + '%</span>';
        html += '</div>';
        html += '<div class="progress" style="height:8px;background:var(--bg-tertiary);">';
        html += '<div class="progress-bar" role="progressbar" style="width:' + t.progress_pct + '%;background-color:var(--accent);transition:width 0.5s ease;"></div>';
        html += '</div></div>';
    }

    if (t.status === 'done' && t.comic_id) {
        html += '<div style="margin-top:6px;">';
        html += '<a href="/comic/' + t.comic_id + '" class="btn btn-sm btn-outline-success py-0 px-2" style="font-size:0.8rem;"><i class="bi bi-book"></i> 查看漫画</a>';
        html += '</div>';
    }

    html += '</div></div>';
    return html;
}

// 事件委托：删除/取消单条
document.getElementById('downloadList').addEventListener('click', function(e) {
    var btn = e.target.closest('[data-task-id]');
    if (!btn) return;
    var type = btn.dataset.taskType;
    var id = btn.dataset.taskId;
    var msg = btn.dataset.confirm || '确定删除此任务记录？';
    if (!confirm(msg)) return;
    fetch('/api/v1/downloads/tasks/' + type + '/' + encodeURIComponent(id), {method: 'DELETE'})
    .then(function() { updateTasks(); })
    .catch(function() { updateTasks(); });
});

function clearFinished() {
    fetch('/api/v1/downloads/tasks')
    .then(function(r) { return r.json(); })
    .then(function(resp) {
        var items = (resp.data && resp.data.items) || [];
        var finished = items.filter(function(t) {
            return ['done', 'error', 'failed'].indexOf(t.status) >= 0;
        });
        if (!finished.length) { showGlobalToast('没有可清除的任务', 'error'); return; }
        Promise.all(finished.map(function(t) {
            return fetch('/api/v1/downloads/tasks/' + t.type + '/' + encodeURIComponent(t.id), {method: 'DELETE'});
        })).then(function() {
            showGlobalToast('已清除 ' + finished.length + ' 条记录', 'success');
            updateTasks();
        });
    });
}

function startPoll() {
    if (pollTimer) clearInterval(pollTimer);
    updateTasks();
    pollTimer = setInterval(updateTasks, 3000);
}

startPoll();
</script>
{% endblock %}
